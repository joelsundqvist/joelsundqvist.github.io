<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla-kod</title>
<style>body{font-family:sans-serif;padding:20px}textarea{width:100%;height:120px;font-size:16px}button{font-size:20px;padding:12px;width:100%;margin-top:10px}</style></head>
<body><h2>Tesla-inloggning klar</h2><p>Kopiera koden nedan och klistra in den i chatten med Grok Bot.</p>
<textarea id="c" readonly></textarea><button onclick="navigator.clipboard.writeText(document.getElementById('c').value);this.textContent='Kopierad!'">Kopiera koden</button>
<script>var p=new URLSearchParams(location.search);document.getElementById('c').value=p.get('code')||('Ingen kod. '+(p.get('error')||'')+' '+(p.get('error_description')||''));</script></body></html>
